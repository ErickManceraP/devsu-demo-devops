apiVersion: v1
kind: ConfigMap
metadata:
  name: devsu-demo-config
  namespace: devsu-demo
  labels:
    app: devsu-demo-nodejs
data:
  NODE_ENV: "production"
  PORT: "8000"
  # SQLite database path — mounted via emptyDir volume
  # Note: for production, replace SQLite with a persistent DB (PostgreSQL, MySQL)
  DATABASE_NAME: "/app/data/dev.sqlite"
