version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: devsu-demo-nodejs
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: development
      PORT: 8000
      DATABASE_NAME: /app/data/dev.sqlite
      DATABASE_USER: user
      DATABASE_PASSWORD: password
    volumes:
      # Persist SQLite database between container restarts
      - sqlite_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/api/users"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local
